name: Build Signed Android 10+ APK

on:
  workflow_dispatch:
  push:
    branches:
      - profit-education-app
      - main

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Optional Custom App Icon Setup
        run: |
          if [ -f "app_icon.png" ]; then
            echo "Custom app_icon.png found! Applying custom launcher icons..."
            sudo apt-get update -y
            sudo apt-get install -y imagemagick
            rm -rf app/src/main/res/mipmap-anydpi-v26
            mkdir -p app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi
            convert app_icon.png -resize 48x48 app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert app_icon.png -resize 72x72 app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert app_icon.png -resize 96x96 app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert app_icon.png -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert app_icon.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            cp app/src/main/res/mipmap-mdpi/ic_launcher.png app/src/main/res/mipmap-mdpi/ic_launcher_round.png
            cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-hdpi/ic_launcher_round.png
            cp app/src/main/res/mipmap-xhdpi/ic_launcher.png app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
            cp app/src/main/res/mipmap-xxhdpi/ic_launcher.png app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
            cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          else
            echo "No app_icon.png found. Using built-in vector icon."
          fi

      - name: Prepare Release Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/release.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "Generating signing keystore for Release APK..."
            keytool -genkeypair -v \
              -keystore "$GITHUB_WORKSPACE/release.jks" \
              -alias profitedukey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass ProfitEdu2025! \
              -keypass ProfitEdu2025! \
              -dname "CN=Profit Education, OU=Mobile, O=Profit Education, L=Dubai, S=Dubai, C=AE"
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/release.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=ProfitEdu2025!" >> $GITHUB_ENV
            echo "KEY_ALIAS=profitedukey" >> $GITHUB_ENV
            echo "KEY_PASSWORD=ProfitEdu2025!" >> $GITHUB_ENV
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare Output APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/ProfitEducation-Android10Plus.apk
          ls -lh output/ProfitEducation-Android10Plus.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProfitEducation-Android10Plus-APK
          path: output/ProfitEducation-Android10Plus.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Profit Education Android 10+ (Build ${{ github.run_number }})
          files: output/ProfitEducation-Android10Plus.apk
          body: |
            Signed Release APK for Android 10 and above (`minSdk 29`).
